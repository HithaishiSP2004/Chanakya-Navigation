version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - BACKEND_API_URL=http://backend:8000/api/v1/buildings/
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=0
      - DB_HOST=db
      - DB_NAME=chanakyanav
      - DB_USER=chanakya
      - DB_PASSWORD=chanakyapass
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=chanakyanav
      - POSTGRES_USER=chanakya
      - POSTGRES_PASSWORD=chanakyapass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
